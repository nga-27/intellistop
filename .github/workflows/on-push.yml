name: On-Push

on: [push]

jobs:
    call_pylint:
        uses: ./.github/workflows/pylint.yml
        with:
            target_branch: ${{ github.ref_name }}
        secrets: inherit

    call_test:
        needs: call_pylint
        if: ${{ needs.call_pylint.outputs.build_status == 'success'}}
        uses: ./.github/workflows/test.yml
        with:
            target_branch: ${{ github.ref_name }}
        secrets: inherit

    echo_test:
        needs: 
            - call_test
            - call_pylint
        if: ${{ needs.call_pylint.outputs.build_status == 'success' && needs.call_test.outputs.test_status == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - name: echoooo
              run: |
                echo "Whoooo success!"