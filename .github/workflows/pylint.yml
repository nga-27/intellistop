name: Pylint

on:
    workflow_call:
        inputs:
            target_branch:
                required: true
                type: string
        outputs:
            build_status:
                value: ${{ jobs.build.outputs.status }}

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        outputs:
            status: ${{ steps.status_value.outcome }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v4
              with:
                python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install .[dev,app]
            
            - name: pylint
              run: |
                pylint $(git ls-files '*.py')
                pylint $(git ls-files 'intellistop/*.py')
                pylint $(git ls-files 'intellistop/libs/*.py')
                pylint $(git ls-files 'utils/*.py')
                pylint $(git ls-files 'plot/*.py')

            - name: set-output
              id: status_value
              run: |
                echo "status=success" >> $GITHUB_OUTPUT
