[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intellistop"
version = "1.3.0"
description = 'Library to determine a intelligent stop-loss for technical analysis of funds.'
authors = [
    {name = "Nick Amell", email = "namell91@gmail.com"}
]
requires-python = ">=3.10.0, <3.13.0"
license = {text = "MIT"}
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]
urls = {homepage = "https://github.com/nga-27/intellistop"}

dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.1",
    "scipy==1.16.0",
    "yfinance==0.2.65",
]

[project.optional-dependencies]
dev = [
    'pylint==3.2.5',
    'pycodestyle==2.12.0',
]
app = [
    "matplotlib==3.10.3"
]

[tool.setuptools.packages.find]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]
